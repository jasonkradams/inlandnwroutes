
site_name: INLAND NW ROUTES
site_description: A comprehensive guide to hiking and scrambling in the American Selkirks, Cabinet Mountain Wilderness, the Bitterroots and more.
theme:
  name: material
  custom_dir: overrides
  palette:
    # Scheme 1: Inland Emerald (Nature Light)
    - scheme: default
      primary: emerald
      accent: teal
      toggle:
        icon: material/tree-outline
        name: "Theme: Inland Emerald (Switch to Mountain Sunset)"

    # Scheme 2: Mountain Sunset (Amber Light)
    - scheme: amber-theme
      primary: amber
      accent: deep-orange
      toggle:
        icon: material/weather-sunny
        name: "Theme: Midnight Ridge"

    # Scheme 3: Midnight Ridge (Alpine Dark)
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: "Theme: Inland Emerald"
  font:
    text: Plus Jakarta Sans
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - navigation.indexes
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - zensical.extensions.glightbox:
      auto_caption: true

extra_css:
  - stylesheets/extra.css

not_in_nav: "blog/posts/*.md"

plugins:
  - search
  - tags
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_url_format: "{slug}"
      authors: true
      authors_file: blog/.authors.yml
      authors_profiles: true
      categories: true
      archive: true
      post_date_format: MMMM d, yyyy
      post_readtime: true
      post_excerpt: optional
      post_excerpt_max_authors: 2

hooks:
  - hooks/stat_card.py

